name: Install verified AstroGuard 18K source
on:
  push:
    branches: [astroguard-18k-staging]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Stage verified AstroGuard 18K source transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check archive checksum and unpack reproducible code
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part_* | base64 --decode > /tmp/astroguard-18k-source.tar.xz
          echo '9bdba64d2cbb0ef146cf1cc3524256e3b14b90ed4b466eaa2d2c32a0d2298cb8  /tmp/astroguard-18k-source.tar.xz' | sha256sum --check
          tar -tJf /tmp/astroguard-18k-source.tar.xz >/dev/null
          rm -rf source-parts
          tar -xJf /tmp/astroguard-18k-source.tar.xz -C .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('- `artifacts/`: compact, executed evidence archives with descriptive filenames.', '- `artifacts/`: report checksums and instructions; large report archives are archived separately.')
          a=s.index('## Compact evidence and provenance')
          b=s.index('## Reuse and citation', a)
          s=s[:a]+'''## Evidence files and provenance

          The results archives have **not yet been uploaded to this repository**.
          The publication-ready archives are:
          - AstroGuard_QFV_18K_Collection_Summary.zip
          - AstroGuard_QFV_18K_Classical_Results.zip
          - AstroGuard_QFV_18K_Matched_Results.zip

          See `artifacts/SHA256SUMS.txt` to verify locally held copies.
          Raw photometry (~3 GB) is excluded from Git and awaits a permitted research-data deposit.
          This repository reports data-provider pseudolabel agreement, not independent ground truth.

          '''+s[b:]
          p.write_text(s)
          p=Path('docs/DATA_AVAILABILITY.md')
          if p.exists():
              s=p.read_text().replace('The collection ZIP in `artifacts/` contains metadata and a freeze statement', 'The separately retained collection ZIP contains metadata and a freeze statement')
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install verified source files for AstroGuard 18K pipeline"
          git push origin HEAD:astroguard-18k-staging
